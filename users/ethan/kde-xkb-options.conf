# KDE keyboard (xkb) options - declarative source of truth.
#
# install.sh merges each option into ~ethan/.config/kxkbrc [Layout] Options
# (a comma-separated list) via kreadconfig6/kwriteconfig6. Options already set
# there (e.g. from the GUI) are kept, except any in the same group as a declared
# one: declaring caps:menu drops an existing caps:* option, since xkb takes only
# one per group. Also sets ResetOldOptions=true, without which Plasma ignores
# Options. Idempotent. Takes effect on next login.
#
# Format:  <xkb-option>
#
# caps:menu - CapsLock becomes an additional Menu key: its caps function is
# gone, and kde-global-shortcuts.conf binds Menu to the Valheim blood magic
# farming auto clicker (valheim-blood-magic-farm).
caps:menu
