# KDE global shortcuts — declarative source of truth.
#
# install.sh asserts each line into ~ethan/.config/kglobalshortcutsrc as
#   [services][<desktop-id>]
#   _launch=<key>
# via kwriteconfig6, which touches ONLY these keys — every other shortcut in
# that file is left untouched, and re-running is idempotent. Repo-authoritative:
# to change a binding, edit it here (a later GUI rebind is reset on next deploy).
# Takes effect on next login (a file write doesn't hot-reload kglobalaccel).
#
# Format:  <desktop-id>  <key-sequence>
todo-capture.desktop             Meta+T
todo-capture-clipboard.desktop   Meta+Shift+T
net.local.razer-battery.desktop  Meta+B
speak-clipboard.desktop          Meta+R
stop-speaking.desktop            Meta+Shift+R
