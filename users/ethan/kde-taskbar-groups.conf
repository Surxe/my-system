# kde-taskbar-groups.conf — declared shortcuts for each monitor's taskbar groups.
#
# Applied by install.sh's deploy step (installers/ethan-taskbar-groups.sh). This
# only ASSERTS CONFIG ON WIDGETS THAT ALREADY EXIST — it never creates or deletes
# widgets (creating panel widgets from a config file is unreliable in Plasma). So
# you add each widget once via the GUI, then install.sh keeps it in sync.
#
# Setup (once, in the GUI), per group:
#   - Add a "Launcher Group" widget (org.surxe.launchergroup) to the monitor's panel.
#   - Open its config and set "Group name" to the group's <Name> below. Launchers
#     can be left blank — install.sh fills them from this file.
#   The widget shows each app's launcher only while the app is closed or minimized,
#   and hides it while the app has a visible window (see the plasmoid).
#
# FORMAT
#   [<connector>]              one section per monitor. <connector> = the output
#                             name from `kscreen-doctor -o` (HDMI-A-1, DP-2). The
#                             only per-machine value; re-point on a new workstation.
#   group <Name>              matches the Launcher Group widget whose "Group name"
#     <launcher-url>          is <Name>; indented lines are its launchers, in order.
#     <launcher-url>          Vocabulary: applications:<id>.desktop, file://…desktop,
#                             preferred://<service> (e.g. preferred://filemanager).
#   show-minimized-tasks [v]  toggle showOnlyMinimized on the panel's EMPTY
#                             (0-launcher) Icons-Only Task Manager. Bare or `true`
#                             => shows only running-and-minimized windows; `false`
#                             => shows all windows (a normal task manager). Omit the
#                             directive entirely to leave the widget untouched.
#
# The installer is idempotent, edits only Launcher Group instances (matched by
# Group name) plus that one empty task manager, and warns (never creates) if a
# named widget is missing. Lines beginning with # and blank lines are ignored.

[HDMI-A-1]
group coding
  applications:code.desktop
  applications:github-desktop.desktop
  applications:claude-dev-split.desktop
  applications:org.kde.konsole.desktop
group media
  applications:com.obsproject.Studio.desktop
  applications:org.kde.kdenlive.desktop
  applications:com.github.PintaProject.Pinta.desktop
  applications:merge-clip-audio.desktop
  applications:jellyfin-server.desktop
  applications:jellyfin-stop.desktop

[DP-2]
group firefox
  applications:org.kde.dolphin.desktop
  applications:discord.desktop
  applications:firefox-esr.desktop
  applications:steam.desktop
  applications:my-shortcuts.desktop
show-minimized-tasks false
