# KDE Plasma (plasmarc) tweaks — declarative source of truth.
#
# install.sh asserts each line into ~ethan/.config/plasmarc as
#   [<group>]
#   <key>=<value>
# via kwriteconfig6, which touches ONLY these keys — every other setting in
# plasmarc is left untouched, and re-running is idempotent. Repo-authoritative:
# to change a value, edit it here (a later GUI change is reset on next deploy).
# Takes effect on next plasmashell reload/login (a file write doesn't hot-reload).
#
# Format:  <group>  <key>  <value>
#
# Delay = task/widget tooltip hover delay in ms (Plasma default 700; 0 = instant,
# -1 = tooltips off). Controls how long a taskbar hover waits before the preview.
PlasmaToolTips  Delay  300
