# kde-taskbar-launchers.conf — declared pinned launchers for each monitor's
# Icons-Only Task Manager, applied by install.sh's deploy_ethan_taskbar_launchers().
#
# Format (whitespace-separated, two fields):
#   <connector>   <comma-separated ordered launcher list>
#
#   <connector>   is the monitor's output name as reported by `kscreen-doctor -o`
#                 (e.g. HDMI-A-1, DP-2). This is the ONLY per-machine parameter:
#                 on a new workstation, re-point these two names and nothing else.
#   launchers     ordered list of launcher URLs, exactly as stored in the applet's
#                 `launchers=` key. `applications:<id>.desktop` for menu apps,
#                 `file://<abs-path>.desktop` for flatpak exports.
#
# Deploy matches each live panel to a connector by screen geometry (see install.sh),
# then writes ONLY that task manager's launchers — every other panel setting
# (height, position, tray, placement) is left untouched. Idempotent: a panel whose
# launchers already match is left alone.
#
# Lines beginning with # and blank lines are ignored.

# Left monitor
HDMI-A-1   applications:code.desktop,applications:github-desktop.desktop,file:///var/lib/flatpak/exports/share/applications/org.avidemux.Avidemux.desktop,file:///var/lib/flatpak/exports/share/applications/com.obsproject.Studio.desktop,applications:org.kde.kdenlive.desktop,file:///var/lib/flatpak/exports/share/applications/com.github.PintaProject.Pinta.desktop

# Right monitor (AoC)
DP-2   applications:firefox-esr.desktop,applications:org.kde.dolphin.desktop,applications:systemsettings.desktop,applications:steam.desktop,applications:discord.desktop,applications:org.kde.kate.desktop
