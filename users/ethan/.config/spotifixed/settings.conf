# spotifixed settings for the copy that runs AS ethan (serve, overlay, ctl).
#
# Deployed to ~/.config/spotifixed/settings.conf by install.sh (ethan-config) and
# sourced by the ~/.local/bin/spotifixed launcher. Repo-authoritative: edit it here
# and redeploy; a hand edit of the live file is overwritten on the next deploy. For a
# quick experiment, every setting is also a flag (spotifixed overlay --help).
#
# No secrets belong here. The one secret (the Apify token) is in secrets.env beside the
# live copy of this file: hand-maintained, never in a repo, read only by the
# spotifixed-sync launcher.
#
# The full list of settings is in the spotifixed README (Configuration).

# The cache and state stay in the dev-side repo, where `sync` (as dev) writes them. The
# daemon reads the cache and writes only per-track lyric offsets into state.
SPOTIFIXED_CACHE_DIR=/srv/dev/repos/spotifixed/cache
SPOTIFIXED_STATE_DIR=/srv/dev/repos/spotifixed/state

# Keyboard media keys, through mpv's MPRIS plugin (Debian package mpv-mpris).
SPOTIFIXED_MPV_MPRIS_PLUGIN=/usr/lib/mpv-mpris/mpris.so

# Where the lyric line sits. Position it with: spotifixed overlay --demo
SPOTIFIXED_OVERLAY_ANCHOR=bottom
SPOTIFIXED_OVERLAY_MARGIN_X=0
SPOTIFIXED_OVERLAY_MARGIN_Y=120
# Output connector (e.g. DP-2). Empty leaves the choice to the compositor.
SPOTIFIXED_OVERLAY_MONITOR=
