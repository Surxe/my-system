# steam-price-tracker: non-secret settings (checked into my-system).
#
# Loaded by the steam-price-refresh.service user unit via EnvironmentFile, so
# every refresh sees these regardless of who/where triggered it. Secrets (the
# SMTP sender + Gmail App Password) live in the sibling smtp.env, which is
# gitignored and created by install.sh — never here.
#
# This is a systemd EnvironmentFile (plain KEY=VALUE, '#' comments). It is NOT a
# .env: systemd does not expand %h/$HOME here, so the path below is absolute.
# It is deliberately not named "*.env" so my-system's `*.env` gitignore (which
# guards against committing secrets) never sees it — this file has none.

# Ethan's curated tracked-apps list. Source of truth is the my-system repo copy
# next to this file; install.sh deploys both here, and this points the tracker
# at the deployed copy.
STEAM_TRACKER_APPS_PATH=/home/ethan/.config/steam-price-tracker/tracked_apps.json

# SMTP transport (Gmail STARTTLS). The sender address, App Password, AND the
# recipient (STEAM_TRACKER_EMAIL_TO) are secrets — they live in smtp.env, not here.
STEAM_TRACKER_SMTP_HOST=smtp.gmail.com
STEAM_TRACKER_SMTP_PORT=587
