# playlist-player settings for the copy that runs AS ethan (serve, overlay, ctl).
#
# Deployed to ~/.config/playlist-player/settings.conf by install.sh (ethan-config) and
# sourced by the ~/.local/bin/playlist-player launcher. Repo-authoritative: edit it here
# and redeploy; a hand edit of the live file is overwritten on the next deploy. For a
# quick experiment, every setting is also a flag (playlist-player overlay --help).
#
# No secrets belong here. The one secret (the Apify token) is in secrets.env beside the
# live copy of this file: hand-maintained, never in a repo, read only by the
# playlist-player-sync launcher.
#
# The full list of settings is in the playlist-player README (Configuration).

# The cache and state stay in the dev-side repo, where `sync` (as dev) writes them. The
# daemon reads the cache and writes only per-track lyric offsets into state.
PLAYLIST_PLAYER_CACHE_DIR=/srv/dev/repos/playlist-player/cache
PLAYLIST_PLAYER_STATE_DIR=/srv/dev/repos/playlist-player/state

# Keyboard media keys, through mpv's MPRIS plugin (Debian package mpv-mpris).
PLAYLIST_PLAYER_MPV_MPRIS_PLUGIN=/usr/lib/mpv-mpris/mpris.so

# Where the lyric line sits. Position it with: playlist-player overlay --demo
PLAYLIST_PLAYER_OVERLAY_ANCHOR=bottom
PLAYLIST_PLAYER_OVERLAY_MARGIN_X=0
PLAYLIST_PLAYER_OVERLAY_MARGIN_Y=120
# Output connector (e.g. DP-2). Empty leaves the choice to the compositor.
PLAYLIST_PLAYER_OVERLAY_MONITOR=
